name: Build IPA (auto-generate Xcode project)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name"
        required: false
        default: "Legen of Zelda: ToTK"
      bundle_id:
        description: "Bundle identifier"
        required: false
        default: "com.Switch.ZeldaToTK"

env:
  APP_NAME: ${{ github.event.inputs.app_name || 'ROMApp' }}
  BUNDLE_ID: ${{ github.event.inputs.bundle_id || 'com.example.romapp' }}

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project (skipped if one already exists)
        run: |
          set -euo pipefail

          if [ -n "$(find . -maxdepth 3 -name '*.xcodeproj' -not -path '*/Pods/*' | head -n 1)" ]; then
            echo "Existing Xcode project found, not generating a new one."
            exit 0
          fi

          # 1) Sources: use your own Swift files in Sources/, otherwise create a minimal SwiftUI app
          if [ -d Sources ] && find Sources -name '*.swift' | grep -q .; then
            echo "Using Swift sources from ./Sources"
          else
            mkdir -p Sources
            cat > Sources/App.swift <<'EOF'
          import SwiftUI

          @main
          struct GeneratedApp: App {
              var body: some Scene {
                  WindowGroup { ContentView() }
              }
          }

          struct ContentView: View {
              private var files: [String] {
                  guard let base = Bundle.main.resourcePath else { return [] }
                  let dir = base + "/rom"
                  return (try? FileManager.default.contentsOfDirectory(atPath: dir))?.sorted() ?? []
              }

              var body: some View {
                  NavigationView {
                      List(files, id: \.self) { Text($0) }
                          .overlay(Group {
                              if files.isEmpty { Text("No files found in the rom folder") }
                          })
                          .navigationTitle("Bundled files")
                  }
              }
          }
          EOF
          fi

          # 2) Bundle everything in ./rom as a folder reference (optional)
          ROM_BLOCK=""
          if [ -d rom ]; then
            ROM_BLOCK="      - path: rom
                  type: folder"
          fi

          # 3) XcodeGen spec
          cat > project.yml <<EOF
          name: ${APP_NAME}
          options:
            bundleIdPrefix: com.example
          targets:
            ${APP_NAME}:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: Sources
          ${ROM_BLOCK}
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
                  PRODUCT_NAME: ${APP_NAME}
                  GENERATE_INFOPLIST_FILE: YES
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  INFOPLIST_KEY_CFBundleDisplayName: ${APP_NAME}
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  SWIFT_VERSION: "5.0"
          EOF

          echo "---- project.yml ----"
          cat project.yml
          xcodegen generate

      - name: Detect project and scheme
        id: detect
        run: |
          set -euo pipefail
          WORKSPACE=$(find . -maxdepth 3 -name "*.xcworkspace" -not -path "*/Pods/*" -not -path "*xcodeproj/*" | head -n 1 || true)
          PROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" -not -path "*/Pods/*" | head -n 1 || true)

          if [ -n "$WORKSPACE" ]; then
            FLAG="-workspace"; TARGET_PATH="$WORKSPACE"; KEY="workspace"
          elif [ -n "$PROJECT" ]; then
            FLAG="-project"; TARGET_PATH="$PROJECT"; KEY="project"
          else
            echo "::error::No Xcode project or workspace found."
            exit 1
          fi

          SCHEME=$(xcodebuild -list -json "$FLAG" "$TARGET_PATH" | jq -r ".${KEY}.schemes[0]")
          echo "flag=$FLAG"        >> "$GITHUB_OUTPUT"
          echo "path=$TARGET_PATH" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME"    >> "$GITHUB_OUTPUT"
          echo "Using $FLAG $TARGET_PATH, scheme '$SCHEME'"

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            ${{ steps.detect.outputs.flag }} "${{ steps.detect.outputs.path }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | tail -n 50

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" -path "*iphoneos*" | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::No .app produced. Check the build log."
            exit 1
          fi
          NAME=$(basename "$APP" .app)
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "${NAME}.ipa" Payload
          ls -lh "${NAME}.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: "*.ipa"
          if-no-files-found: error

      - name: Upload generated project and log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            build.log
            project.yml
          if-no-files-found: ignore
